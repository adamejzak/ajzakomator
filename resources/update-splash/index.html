<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ajzakomator</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self' data:; script-src 'self'" />
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="card" data-stage="preparing">
      <header class="top">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="#f4f4f5" />
          <path d="M9.5 11.5l4.5 4.5-4.5 4.5" fill="none" stroke="#0b0b0c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M16.5 21h6.5" stroke="#0b0b0c" stroke-width="2.6" stroke-linecap="round" />
        </svg>
        <strong>ajzakomator</strong>
        <span class="versions" id="versions"></span>
        <button class="dismiss" id="dismiss" hidden aria-label="Close">&#x2715;</button>
      </header>

      <section class="body">
        <h1 id="title"></h1>
        <div class="line">
          <p class="status" id="status" aria-live="polite"></p>
          <span class="percent" id="percent">0%</span>
        </div>
        <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter"><span class="fill" id="fill"></span></div>
      </section>

      <footer class="foot">
        <p id="hint"></p>
        <div class="actions" id="actions" hidden>
          <button class="primary" id="open"></button>
          <button id="close"></button>
        </div>
      </footer>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
