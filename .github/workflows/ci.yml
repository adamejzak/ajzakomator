name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pushes to main only need the fast checks; the three platform packages are built for tags, pull requests
  # and manual runs (a manual run is a full rehearsal of a release).
  quick:
    name: Checks
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  # Fails in seconds when a tag does not match package.json or has no release notes.
  release-metadata:
    name: Release metadata
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-release-tag.mjs

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: windows-x64
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - name: macOS Apple Silicon
            os: macos-15
            command: npm run dist:mac -- --arm64
            artifact: macos-arm64
            files: |
              release/*-mac-arm64.dmg
              release/*-mac-arm64.zip
              release/latest-mac*.yml
          - name: macOS Intel
            os: macos-15-intel
            command: npm run dist:mac -- --x64
            artifact: macos-x64
            files: |
              release/*-mac-x64.dmg
              release/*-mac-x64.zip
              release/latest-mac*.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - name: Package application
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged terminal runtime
        run: npm run test:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ajzakomator-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
